image:
  repository: ghcr.io/astromechza/stars
  tag: main
  pullPolicy: IfNotPresent

service:
  port: 80
  targetPort: 8080

persistence:
  size: 1Gi
  storageClass: ""

ingress:
  enabled: true
  className: nginx
  host: stars.local
  # cert-manager: set clusterIssuer (or issuer) so ingress-shim requests a
  # per-host certificate via the issuer's DNS-01 solver. Leave empty to skip.
  clusterIssuer: ""
  # Set one of clusterIssuer/issuer; clusterIssuer takes precedence.
  issuer: ""
  tls:
    enabled: false
    # Secret cert-manager writes the cert into. Defaults to <fullname>-tls.
    secretName: ""
  # Authelia forward-auth annotations (adjust URLs to your Authelia install).
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.authelia.svc.cluster.local/api/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.example.com?rm=$request_method"
    nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Email,Remote-Name,Remote-Groups"

env: {}
