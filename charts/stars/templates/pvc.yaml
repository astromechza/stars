apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "stars.fullname" . }}-data
  labels: {{- include "stars.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
